<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>健康中国论述摘编学习站</title>
<style>
:root{--paper:#EDF1EF;--sheet:#FFFFFF;--ink:#17201E;--ink-2:#3F4C48;--muted:#6B7874;--line:#D3DCD8;--red:#AF2A22;--teal:#1B6A5A;--on-ink:#FFFFFF;color-scheme:light}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:15px;line-height:1.7;display:flex;align-items:center;justify-content:center;min-height:100vh;box-sizing:border-box;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.box{width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:28px 24px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 30px -24px rgba(23,32,30,.5);box-sizing:border-box}
.seal{align-self:flex-start;border:2px solid var(--red);color:var(--red);font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;font-weight:900;font-size:13px;line-height:1.2;padding:2px 6px;letter-spacing:.12em;border-radius:3px;transform:rotate(-3deg)}
h1{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;font-weight:900;font-size:24px;line-height:1.3;margin:0}
p{margin:0;color:var(--ink-2);font-size:14px}
input[type=password]{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--sheet);color:var(--ink);width:100%;box-sizing:border-box}
input[type=password]:focus{outline:none;border-color:var(--ink-2)}
.rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.rem input{accent-color:var(--teal);width:16px;height:16px;margin:0}
button{font:inherit;font-size:15px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);border-radius:8px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.err{color:var(--red);font-size:13px;min-height:1.4em}
.foot{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <span class="seal">健康中国</span>
  <h1>论述摘编学习站</h1>
  <p>《习近平关于健康中国论述摘编》期末复习：知识卡片、原话填空、题库和60分钟模拟考。</p>
  <input type="password" id="pw" placeholder="请输入访问密码" aria-label="访问密码" autocomplete="current-password">
  <label class="rem"><input type="checkbox" id="rem" checked>在这台设备上记住密码</label>
  <button type="submit" id="go">进入</button>
  <p class="err" id="err" role="alert"></p>
  <p class="foot">学习进度只保存在当前浏览器里。</p>
</form>
